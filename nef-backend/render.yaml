# Render Blueprint for the backend API (optional - you can also create the
# service by hand in the Render dashboard; see README section 5).
# Secrets marked "sync: false" are entered in the Render dashboard, never here.
services:
  - type: web
    name: nef-backend
    runtime: node
    plan: free            # change to "starter" for an always-on service
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGIN
        sync: false       # the frontend's URL, e.g. https://nef-dashboard.onrender.com
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_SSL_CA
        sync: false
